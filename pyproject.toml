[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dumplingsAI"
version = "0.4.0"
description = "Lightweight multi-agent collaboration framework on top of LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Secret Dumplings" }]
keywords = ["llm", "agent", "multi-agent", "mcp", "ai-framework", "anthropic", "claude", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "lxml>=6.0.2",
    "mcp>=1.14.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",  # mcp 间接依赖（pydantic_settings 需要）
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "watchdog>=3.0",
]

[project.urls]
Homepage = "https://github.com/Secret-Dumplings/dumplingsAI"
Repository = "https://github.com/Secret-Dumplings/dumplingsAI.git"
Issues = "https://github.com/Secret-Dumplings/dumplingsAI/issues"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.setuptools]
packages = ["dumplingsAI"]
package-dir = {"dumplingsAI" = "."}
include-package-data = true

# docs-site/（VitePress 文档站 + FastAPI 后端）绝不进 wheel / sdist ——
# 它只是本仓库的文档工具，不是 Python 包；排除避免污染用户安装。
[tool.setuptools.exclude-package-data]
"*" = ["docs-site/**/*", "docs-site/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 默认跑：单测（跳过 benchmark）。跑 benchmark 用 ``pytest -m benchmark`` 显式跑。
addopts = "-ra -m 'not benchmark'"
markers = [
    "benchmark: 性能基准测试（默认跳过；用 -m benchmark 显式跑）",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
