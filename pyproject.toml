[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tangyuanAI"
version = "1.1.0"
description = "Lightweight multi-agent collaboration framework on top of LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Secret Tangyuan" }]
keywords = ["llm", "agent", "multi-agent", "mcp", "ai-framework", "anthropic", "claude", "async", "plugin", "rag", "image"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.27",
    "loguru>=0.7.3",
    "mcp>=1.14.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",  # mcp 间接依赖（pydantic_settings 需要）
    "pyyaml>=6.0",
    "watchdog>=3.0",
]

[project.optional-dependencies]
# A2A 导出（核心原生支持；把本地 agent 暴露为 A2A HTTP endpoint）
a2a = ["aiohttp>=3.9"]
# 插件（v1.1.0+）：KB / 图片生成 拆分为独立插件包，通过 [all] 一起安装。
# 也可以单独安装：pip install tangyuanai-rag-plus / tangyuanai-image-plus
# 插件（v1.1.0+）：KB / 图片生成 拆分为独立插件包，通过 [all] 一起安装。
# 也可以单独安装：pip install tangyuanai-rag-plus / tangyuanai-image-plus
kb = ["tangyuanai-rag-plus @ git+https://github.com/secret-tangyuan/tangyuanAI_RAG_plus.git@main"]
image = ["tangyuanai-image-plus @ git+https://github.com/secret-tangyuan/tangyuanAI_image_plus.git@main"]
all = [
    "tangyuanai-image-plus @ git+https://github.com/secret-tangyuan/tangyuanAI_image_plus.git@main",
    "tangyuanai-rag-plus @ git+https://github.com/secret-tangyuan/tangyuanAI_RAG_plus.git@main",
]

[project.urls]
Homepage = "https://github.com/secret-tangyuan/tangyuanAI"
Repository = "https://github.com/secret-tangyuan/tangyuanAI.git"
Issues = "https://github.com/secret-tangyuan/tangyuanAI/issues"

# CLI 命令：pip install 后 `tangyuanai` 可用
[project.scripts]
tangyuanai = "tangyuanAI.cli:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = true

[tool.setuptools]
packages = ["tangyuanAI", "tangyuanAI.kb", "tangyuanAI.imaging"]
package-dir = {"tangyuanAI" = "."}
include-package-data = true

# docs-site/（VitePress 文档站 + FastAPI 后端）绝不进 wheel / sdist ——
# 它只是本仓库的文档工具，不是 Python 包；排除避免污染用户安装。
[tool.setuptools.exclude-package-data]
"*" = ["docs-site/**/*", "docs-site/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 默认跑：单测（跳过 benchmark + flaky）。跑 benchmark 用 ``pytest -m benchmark``；
# 跑 flaky（网络敏感/并发竞争）用 ``pytest -m flaky`` 显式跑。
addopts = "-ra -m 'not benchmark and not flaky'"
markers = [
    "benchmark: 性能基准测试（默认跳过；用 -m benchmark 显式跑）",
    "flaky: 已知不稳定（网络敏感 / mock 队列竞争），默认跳过；用 -m flaky 显式跑",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
