name: Sync docs to GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-to-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Wiki 是独立 git 仓库（``<repo>.wiki.git``）。clone → 覆盖 md → commit → push。
      # 这种方式比 GitHub Wiki API 稳得多：避免 slug 计算 / sha 传递 / 首次创建限制。
      - name: Clone wiki repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Copy docs to wiki
        run: |
          cd wiki
          # 先清掉旧 md（避免遗留）
          rm -f *.md
          # 复制 docs/*.md → wiki/（index.md 重命名为 Home.md）
          for f in ../docs/*.md; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .md)
            if [ "$name" = "index" ]; then
              cp "$f" "Home.md"
            else
              cp "$f" "${name}.md"
            fi
          done
          echo "## Synced files ##"
          ls -la *.md

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit (docs unchanged)."
            exit 0
          fi
          git commit -m "docs: sync from main ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          # 第一次 push wiki 已有 Home.md 但其他 page 还没有 → 正常 push
          git push