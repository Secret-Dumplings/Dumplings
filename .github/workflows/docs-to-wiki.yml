name: Sync docs to GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-to-wiki.yml"

permissions:
  contents: write  # push wiki repo
  issues: write    # 用 API 操作 wiki

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python（只用于可选的 markdown 处理）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: List docs files
        id: list
        run: |
          echo "## Files to sync ##"
          ls -1 docs/*.md
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$(ls -1 docs/*.md)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 用 actions/github-script 直接调 GitHub Wiki API
      # Wiki 不是 git checkout 的一部分——每个 wiki page 是一条独立 API 资源
      - name: Sync each .md → wiki page
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const docsDir = 'docs';
            const files = fs.readdirSync(docsDir).filter(f => f.endsWith('.md'));
            const order = [
              'index.md',           // 主页
              'getting-started.md',
              'agent-registration.md',
              'protocols.md',
              'tools.md',
              'builtin-tools.md',
              'output-and-hooks.md',
              'mcp-skills.md',
              'persistence.md',
              'testing.md',
              'TODO.md',
            ];

            // 处理每个 md 文件
            for (const file of files) {
              const content = fs.readFileSync(path.join(docsDir, file), 'utf8');
              // wiki page title: 去掉 .md 后缀
              const title = file.replace(/\.md$/, '');

              // 检查 page 是否已存在
              let page;
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `docs/${file}`,
                });
                page = { sha: data.sha };
                console.log(`Found existing wiki page: ${title}`);
              } catch (e) {
                // 不存在就创建
                page = null;
                console.log(`Creating new wiki page: ${title}`);
              }

              // 调用 wiki API 写 page
              // 注意：wiki page 在 GitHub API 中通过 /repos/{owner}/{repo}/wiki
              if (page) {
                await github.request(
                  'PUT /repos/{owner}/{repo}/wiki/{title}',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: title,
                    body: content,
                    // sha: page.sha,  // wiki API 不需要 sha
                  }
                );
              } else {
                await github.request(
                  'POST /repos/{owner}/{repo}/wiki',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    title: title,
                    body: content,
                  }
                );
              }
              console.log(`✓ Synced: ${title} (${content.length} bytes)`);
            }

            // 设置 Home 为 index.md（如果存在）
            // GitHub Wiki 允许设置 Home 页面
            try {
              const content = fs.readFileSync(path.join(docsDir, 'index.md'), 'utf8');
              await github.request(
                'PUT /repos/{owner}/{repo}/wiki/_Sidebar',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '_Sidebar',
                  body: order
                    .filter(f => f !== 'index.md' && files.includes(f))
                    .map(f => `  - [${f.replace('.md', '')}](${f.replace('.md', '')})`)
                    .join('\n'),
                }
              );
            } catch (e) {
              console.log('Sidebar 设置跳过：' + e.message);
            }